
{% load static %}

<style>
    .professional-footer {
        position: relative;
        padding-top: 28px;
        color: #52647b;
        background: rgba(255, 255, 255, 0.92);
        border-top: 1px solid #dfe7f2;
    }

    .professional-footer .footer-brand {
        color: #263b56;
        font-size: 21px;
        font-weight: 750;
        letter-spacing: -0.5px;
    }

    .professional-footer .footer-brand span {
        color: #3569c8;
    }

    .professional-footer .footer-description {
        max-width: 310px;
        margin-top: 9px;
        color: #77869a;
        font-size: 13px;
        line-height: 1.8;
    }

    .professional-footer .footer-heading {
        margin-bottom: 12px;
        color: #344860;
        font-size: 13px;
        font-weight: 700;
    }

    .professional-footer .footer-link {
        display: inline-block;
        margin-bottom: 9px;
        color: #738198;
        font-size: 13px;
        text-decoration: none;
        transition: color 0.2s ease, transform 0.2s ease;
    }

    .professional-footer .footer-link:hover {
        color: #3569c8;
        transform: translateX(3px);
    }

    .professional-footer .footer-bottom {
        margin-top: 24px;
        padding: 18px 0;
        border-top: 1px solid #e9eef5;
        color: #8491a3;
        font-size: 12px;
    }

    .professional-footer .payment-icons {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        color: #627894;
    }

    .professional-footer .payment-icons i {
        transition: color 0.2s ease, transform 0.2s ease;
    }

    .professional-footer .payment-icons i:hover {
        color: #3569c8;
        transform: translateY(-3px);
    }

   
/* Mobile-only footer improvements */
@media (max-width: 767px) {

    .professional-footer {
        padding-top: 22px;
    }

    .professional-footer > .container {
        padding-left: 14px;
        padding-right: 14px;
    }

    /* Brand section */
    .professional-footer .footer-column:first-child {
        flex: 0 0 100%;
        max-width: 100%;
        margin-bottom: 22px;
    }

    .professional-footer .footer-brand {
        font-size: 20px;
    }

    .professional-footer .footer-description {
        max-width: 100%;
        margin-top: 7px;
        font-size: 13px;
        line-height: 1.7;
    }

    /* Shopping and payment sections */
    .professional-footer .footer-column:nth-child(2),
    .professional-footer .footer-column:nth-child(3) {
        flex: 0 0 50%;
        max-width: 50%;
        margin-bottom: 18px;
    }

    .professional-footer .footer-heading {
        margin-bottom: 10px;
        font-size: 12px;
        line-height: 1.5;
    }

    .professional-footer .footer-link {
        font-size: 12px;
        line-height: 1.6;
    }

    .professional-footer .payment-icons {
        justify-content: flex-start;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 4px;
    }

    .professional-footer .payment-icons i {
        font-size: 25px;
    }

    /* Copyright section */
    .professional-footer .footer-bottom {
        margin-top: 4px;
        padding: 15px 0;
        text-align: center;
        font-size: 11px;
        line-height: 1.8;
    }

    .professional-footer .footer-bottom .row > div {
        flex: 0 0 100%;
        max-width: 100%;
        text-align: center;
    }
}

/* Extra-small phones */
@media (max-width: 380px) {

    .professional-footer > .container {
        padding-left: 11px;
        padding-right: 11px;
    }

    .professional-footer .footer-column:nth-child(2),
    .professional-footer .footer-column:nth-child(3) {
        padding-left: 9px;
        padding-right: 9px;
    }

    .professional-footer .footer-heading {
        font-size: 11px;
    }

    .professional-footer .payment-icons {
        gap: 8px;
    }

    .professional-footer .payment-icons i {
        font-size: 22px;
    }
}

    @media (prefers-reduced-motion: reduce) {
        .professional-footer * {
            transition: none !important;
        }
    }
</style>

<footer class="professional-footer">
    <div class="container">

        <div class="row">

            <!-- Brand -->
            <div class="col-md-5 footer-column">
                <div class="footer-brand">
                    Great<span>Kart</span>
                </div>

                <p class="footer-description">
                    A simple and convenient place to explore products
                    and enjoy a smooth online shopping experience.
                </p>
            </div>

            <!-- Shopping -->
            <div class="col-6 col-md-3 footer-column">
                <h6 class="footer-heading">SHOPPING</h6>

                <div>
                    <a href="{% url 'store' %}" class="footer-link">
                        Browse Products
                    </a>
                </div>
            </div>

            <!-- Payment -->
            <div class="col-6 col-md-4 footer-column">
                <h6 class="footer-heading">PAYMENT METHODS</h6>

                <div class="payment-icons">
                    <i class="fab fa-cc-visa fa-2x" aria-label="Visa"></i>
                    <i class="fab fa-cc-paypal fa-2x" aria-label="PayPal"></i>
                    <i class="fab fa-cc-mastercard fa-2x" aria-label="Mastercard"></i>
                </div>
            </div>

        </div>

        <!-- Copyright -->
        <div class="footer-bottom">
            <div class="row align-items-center">
                <div class="col-md-8">
                    &copy; {% now "Y" %} GreatKart. All rights reserved.
                </div>

                <div class="col-md-4 text-md-right">
                    Made for a better shopping experience.
                </div>
            </div>
        </div>

    </div>
</footer>
