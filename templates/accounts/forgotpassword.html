{% extends 'base.html' %}
{% block content %}

<section class="section-conten padding-y" style="min-height:84vh">

<!-- ============================ COMPONENT LOGIN   ================================= -->
	<div class="card mx-auto" style="max-width: 380px; margin-top:100px;">
      <div class="card-body">
      <h4 class="card-title mb-4">Forgot Password</h4>
       {% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %} 
      <form method="POST" action="{% url 'forgotpassword' %}">
      {% csrf_token %}
          <div class="form-group">
			 <input type="email" name='email' class="form-control" placeholder="Email Address" >
          </div> <!-- form-group// -->
         
          <div class="form-group">
          	<a href="{% url 'loggedin' %}" class="float-right">Go Back</a> 
           
          </div> <!-- form-group form-check .// -->
          <div class="form-group">
              <button type="submit" class="btn btn-primary btn-block"> Submit </button>
          </div> <!-- form-group// -->    
      </form>
      </div> <!-- card-body.// -->
    </div> <!-- card .// -->

     <p class="text-center mt-4">Don't have account? <a href="{% url 'register' %}">Sign up</a></p>
     <br><br>
<!-- ============================ COMPONENT LOGIN  END.// ================================= -->


</section>

<style>
/* Mobile-only Forgot Password improvements */
@media (max-width: 767px) {
    .forgot-password-page {
        box-sizing: border-box;
        min-height: 75vh !important;
        padding: 28px 14px 24px;
    }

    .forgot-password-page .card {
        width: 100%;
        max-width: 380px;
        margin: 20px auto 0 !important;
        border: 1px solid #e2e9f3;
        border-radius: 13px;
        box-shadow: 0 5px 20px rgba(37, 63, 100, 0.07);
    }

    .forgot-password-page .card-body {
        padding: 22px 18px;
    }

    .forgot-password-page .card-title {
        margin-bottom: 22px !important;
        font-size: 21px;
        line-height: 1.4;
        font-weight: 700;
    }

    .forgot-password-page .form-group {
        margin-bottom: 17px;
    }

    .forgot-password-page .form-control {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        min-height: 47px;
        padding: 11px 13px;
        border-radius: 8px;
        font-size: 16px;
    }

    .forgot-password-page .form-group a {
        font-size: 13px;
    }

    .forgot-password-page .btn-primary {
        width: 100%;
        min-height: 47px;
        border-radius: 8px;
        font-weight: 600;
    }

    .forgot-password-page > p {
        margin: 20px 0 0 !important;
        font-size: 14px;
        line-height: 1.7;
    }

    .forgot-password-page > br {
        display: none;
    }
}

/* Extra-small phones */
@media (max-width: 380px) {
    .forgot-password-page {
        padding-right: 10px;
        padding-left: 10px;
    }

    .forgot-password-page .card-body {
        padding: 19px 15px;
    }

    .forgot-password-page .card-title {
        font-size: 19px;
    }
}
</style>

{% endblock %}
