
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="cache-control" content="max-age=604800">

    <meta name="theme-color" content="#191a1e">
    <meta name="description" content="GreatKart - Discover quality products at great prices.">

    <title>GreatKart | Modern Online Shopping</title>

    <link href="{% static 'images/favicon.ico' %}"
          rel="shortcut icon" type="image/x-icon">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Existing JavaScript -->
    <script src="{% static 'js/jquery-2.0.0.min.js' %}"
            type="text/javascript"></script>

    <!-- Bootstrap and icons -->
    <link href="{% static 'css/bootstrap.css' %}"
          rel="stylesheet" type="text/css">
    <link href="{% static 'fonts/fontawesome/css/all.min.css' %}"
          rel="stylesheet" type="text/css">

    <!-- Existing stylesheets -->
    <link href="{% static 'css/ui.css' %}"
          rel="stylesheet" type="text/css">
    <link href="{% static 'css/responsive.css' %}"
          rel="stylesheet" media="only screen and (max-width: 1200px)">
    <link href="{% static 'css/custom.css' %}"
          rel="stylesheet" type="text/css">

    <!-- Bootstrap and existing scripts -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"
            type="text/javascript" defer></script>
    <script src="{% static 'js/script.js' %}"
            type="text/javascript" defer></script>

    <style>
        /* ========== GLOBAL THEME ========== */

        :root {
            --page-bg: #191a1e;
            --surface: #222329;
            --surface-hover: #2b2c32;
            --text-main: #f3f3f5;
            --text-muted: #a6a7ae;
            --accent: #e63946;
            --accent-hover: #c92e3a;
            --soft-border: rgba(255, 255, 255, .08);
            --shadow: 0 10px 30px rgba(0, 0, 0, .2);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
            scroll-padding-top: 85px;
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: clip;
            color: var(--text-main);
            background:
                radial-gradient(
                    ellipse at 5% 5%,
                    rgba(111, 34, 44, .16),
                    transparent 38%
                ),
                radial-gradient(
                    ellipse at 95% 55%,
                    rgba(70, 72, 90, .12),
                    transparent 40%
                ),
                var(--page-bg);
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        img,
        video,
        iframe {
            max-width: 100%;
        }

        img {
            height: auto;
        }

        main {
            position: relative;
            min-height: 65vh;
            animation: contentAppear .5s ease both;
        }

        @keyframes contentAppear {
            from {
                opacity: 0;
                transform: translateY(7px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== TYPOGRAPHY ========== */

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-main);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            font-weight: 700;
            line-height: 1.3;
        }

        p {
            color: inherit;
        }

        a {
            transition: color .2s ease;
        }

        a:hover {
            color: #ff6974;
        }

        /* ========== BUTTONS ========== */

        .btn {
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            transition:
                transform .22s ease,
                box-shadow .22s ease,
                background-color .22s ease,
                border-color .22s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            color: #fff;
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn-primary:hover,
        .btn-primary:focus {
            color: #fff;
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            box-shadow: 0 5px 16px rgba(230, 57, 70, .2);
        }

        .btn-outline-primary {
            color: #ff6974;
            border-color: rgba(230, 57, 70, .65);
        }

        .btn-outline-primary:hover {
            color: #fff;
            background: var(--accent);
            border-color: var(--accent);
        }

        /* ========== FORMS ========== */

        input,
        select,
        textarea,
        button {
            max-width: 100%;
            font-family: inherit;
        }

        input:not([type="checkbox"]):not([type="radio"]),
        select,
        textarea {
            border-radius: 7px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline-color: var(--accent);
        }

        /* ========== CONTENT SURFACES ========== */

        .card,
        .box {
            border-color: var(--soft-border);
        }

        .alert {
            border-radius: 9px;
        }

        /* Avoid forcing dark colors onto product images. */
        .img-wrap img,
        .card img {
            max-width: 100%;
        }

        /* ========== RESPONSIVE ========== */

        @media (max-width: 991.98px) {
            .container,
            .container-fluid {
                max-width: 100%;
            }

            .table-responsive {
                overflow-x: auto;
            }
        }

        @media (max-width: 575.98px) {
            body {
                font-size: 14px;
                line-height: 1.55;
            }

            .container,
            .container-fluid {
                padding-right: 12px;
                padding-left: 12px;
            }

            h1 { font-size: 1.7rem; }
            h2 { font-size: 1.4rem; }
            h3 { font-size: 1.2rem; }

            .btn {
                min-height: 40px;
            }

            input:not([type="checkbox"]):not([type="radio"]),
            select,
            textarea {
                font-size: 16px;
            }
        }

        /* ========== ACCESSIBILITY ========== */

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    {% include 'includes/header.html' %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include 'includes/footer.html' %}

</body>
</html>
